name: PHP Composer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: soap, openssl, zlib, xsl, pdo_sqlite
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.5-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.5-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Security audit
      run: composer audit

    - name: PHPStan Lint
      run: composer run-script lint:ci

    - name: Unit Tests
      run: vendor/bin/phpunit

  docker:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build FrankenPHP image
      run: docker build --target frankenphp_prod -t beatose:ci .

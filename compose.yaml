x-app: &app
  image: ${IMAGES_PREFIX:-}beatose
  build:
    context: .
    target: frankenphp_prod
    args:
      XSLT_URL: ${XSLT_URL:-}
  restart: unless-stopped
  environment: &app-env
    APP_SECRET: ${APP_SECRET:-!ChangeThisSecret!}
    SOAP_USER: ${SOAP_USER:-20123456789MODDATOS}
    SOAP_PASS: ${SOAP_PASS:-moddatos}
    SIGN_PASS: ${SIGN_PASS:-greenter}
    MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default}

services:
  php:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: ${SERVER_NAME:-:80}
      # Directivas extra del worker, p. ej. "num 4" (por defecto: 2 x núcleos de CPU)
      FRANKENPHP_WORKER_CONFIG: ${FRANKENPHP_WORKER_CONFIG:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - cpe_data:/app/var/data
      - cpe_files:/app/var/cpe_files
    ports:
      - target: 80
        published: ${HTTP_PORT:-8000}
        protocol: tcp

  # Procesa en segundo plano los resúmenes (sendSummary) y lotes (sendPack).
  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    depends_on:
      - php
    volumes:
      - cpe_data:/app/var/data
      - cpe_files:/app/var/cpe_files

volumes:
  caddy_data:
  caddy_config:
  cpe_data:
  cpe_files:

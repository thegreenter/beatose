framework:
    messenger:
        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000

        routing:
            App\Message\ProcessSummary: async
            App\Message\ProcessPack: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
